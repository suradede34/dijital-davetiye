<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#441416">
<title>Buket & Aykut — Davetiye</title>
<style>
  :root{ --s:.5; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{height:100%;background:#441416;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
  body{position:fixed;inset:0}
  /* ekranın boş kalan yerlerini aynı kırmızı doku doldurur (telefon/ geniş ekran) */
  body::before{content:"";position:fixed;inset:-24px;background:#441416 url(assets/red.jpg) center/cover no-repeat;filter:blur(3px) brightness(.8)}

  /* Tasarım 924x1300 sabit tuval (PDF sayfasının birebir ölçüsü); JS ile ekrana sığdırılır */
  #stage{position:absolute;left:50%;top:50%;width:924px;height:1300px;margin:-650px 0 0 -462px;
    transform-origin:center center}
  #bg{position:absolute;inset:0;
    background:url(assets/red.jpg) 0.44px -171px/921.7px 1636.8px no-repeat;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent);
    mask-composite:intersect}
  .abs{position:absolute}
  img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
  svg.page{position:absolute;left:0;top:0;width:924px;height:1301px;overflow:visible}

  /* ================= SAHNE A ================= */
  #sceneA{position:absolute;inset:0;transition:opacity 1.2s ease, transform 1.4s ease, filter 1.2s ease}
  #sceneA.out{opacity:0;transform:scale(1.08);filter:blur(4px);pointer-events:none}
  .fadeIn{opacity:0;transition:opacity 1.2s ease}
  .fadeIn.show{opacity:1}
  .fadeUp{opacity:0;transform:translateY(8px);transition:opacity 1.4s ease, transform 1.4s ease}
  .fadeUp.show{opacity:1;transform:none}

  #stripClip{left:402.9px;top:500px;width:116.4px;height:420px;overflow:hidden}
  #strip{position:absolute;left:0;top:calc(500.6px - 500px);width:116.4px;height:358.8px;background:#f3f1ea;
    transform:translateY(-380px);box-shadow:0 5px 12px rgba(0,0,0,.35)}
  #strip .ph{position:absolute;left:12.4px;width:91.8px;height:104.5px;background-repeat:no-repeat;
    outline:1px solid rgba(61,52,52,.55);outline-offset:-0.5px}
  #strip .p1{top:11.5px;background-image:url(assets/photo1.jpg);background-size:139.14px 208.26px;background-position:-23.6px -51.91px}
  #strip .p2{top:127.2px;background-image:url(assets/photo2.jpg);background-size:168.7px 252.82px;background-position:-26.17px -109.86px}
  #strip .p3{top:242.8px;background-image:url(assets/photo3.jpg);background-size:139.14px 208.71px;background-position:-23.66px -52.01px}
  #strip.drop{transition:transform 1.9s cubic-bezier(.3,0,.2,1);transform:translateY(0)}
  #strip.leave{transition:transform 1.2s ease-in, opacity 1s ease;transform:translateY(160px);opacity:0}

  #btn{left:424px;top:881px;width:80px;height:80px;border-radius:50%;cursor:default;pointer-events:none}
  #btn::before{content:"";position:absolute;inset:-26px;border-radius:50%}   /* parmak için geniş dokunma alanı */
  #btn.ready{cursor:pointer;pointer-events:auto}
  #btn.ready::after{content:"";position:absolute;inset:6px;border-radius:50%;
    border:2px solid rgba(255,238,200,.85);animation:ring 1.6s ease-out infinite}
  #btn.pressed{transform:scale(.88);transition:transform .15s}
  @keyframes ring{0%{transform:scale(.7);opacity:.95}100%{transform:scale(1.9);opacity:0}}
  #hintBtn{left:0;width:100%;top:1003px;text-align:center;font:600 28px Georgia,serif;letter-spacing:4px;color:#5a1a1f;
    opacity:0;transition:opacity 1s}
  #hintBtn.show{opacity:.9;animation:blink 2.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}

  /* ================= SAHNE B (4. sayfa) ================= */
  #sceneB{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 1.4s ease}
  #sceneB.in{opacity:1}
  #sceneB.in .page{pointer-events:auto}
  .it{opacity:0;transform:translateY(10px) scale(.86);transform-box:fill-box;transform-origin:center;
      transition:opacity 1s ease, transform 1.2s cubic-bezier(.2,.9,.25,1.12)}
  .it.show{opacity:1;transform:none}
  #vinylSpin{transform-box:fill-box;transform-origin:center}
  #vinylSpin.spin{animation:spin 3.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loc:hover #e-loc,#loc2:hover #e-venue{filter:brightness(1.3)}
  .note{position:absolute;z-index:9;color:#e7d3a5;font:700 30px serif;opacity:0;pointer-events:none}
  .note.go{animation:noteUp 3.6s ease-out forwards}
  @keyframes noteUp{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),-210px) rotate(var(--rt))}}

  /* ================= MEKTUP / KAPAK (tüm ekranı kaplar) ================= */
  #cover{position:fixed;inset:0;z-index:50;pointer-events:none;perspective:2200px;overflow:hidden}
  .door{position:absolute;inset:0;background:#2f4a26 url(assets/green.jpg) center/cover no-repeat;
    backface-visibility:hidden;will-change:transform;
    transition:transform 2.3s cubic-bezier(.55,.05,.25,1)}
  #dL{clip-path:inset(0 50% 0 0);transform-origin:0 50%}
  #dR{clip-path:inset(0 0 0 50%);transform-origin:100% 50%}
  #cover.open #dL{transform:rotateY(-112deg)}
  #cover.open #dR{transform:rotateY(112deg)}
  .door::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.07),rgba(0,0,0,.3))}
  #seamShadow{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:rgba(0,0,0,.3);filter:blur(2px);transition:opacity .6s}
  #cover.open #seamShadow{opacity:0}
  /* mühür: ekranın tam ortasında (yatay + dikey) */
  #seal{position:fixed;left:50%;top:50%;width:calc(230px*var(--s));height:calc(236px*var(--s));
    margin:calc(-118px*var(--s)) 0 0 calc(-115px*var(--s));pointer-events:auto;cursor:pointer;z-index:5}
  #seal img{width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
  #seal:not(.broken){animation:sealPulse 2.4s ease-in-out infinite}
  @keyframes sealPulse{50%{transform:scale(1.045)}}
  .half{position:absolute;inset:0;transition:transform 1s cubic-bezier(.4,.1,.3,1), opacity .9s ease}
  .half.l{clip-path:inset(0 50% 0 0)}
  .half.r{clip-path:inset(0 0 0 50%)}
  #seal.broken{animation:none;pointer-events:none}
  #seal.broken .l{transform:translate(-50px,60px) rotate(-18deg);opacity:0}
  #seal.broken .r{transform:translate(50px,80px) rotate(20deg);opacity:0}
  #hintSeal{position:fixed;left:0;right:0;top:calc(50% + 150px*var(--s));text-align:center;
    font:600 max(12px,calc(28px*var(--s))) Georgia,serif;letter-spacing:.18em;color:#e7d3a5;
    opacity:.85;animation:blink 2.4s ease-in-out infinite;transition:opacity .5s;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #hintSeal.hide{opacity:0;animation:none}
  #cover.gone{display:none}

  /* Spotify oynatıcısı: görünmez. Yalnızca tarayıcı sesi engellerse (#spWrap.need) çok kısa süre görünür */
  #spWrap{position:fixed;left:50%;bottom:10px;width:min(92vw,360px);height:80px;margin-left:calc(min(92vw,360px)/-2);
    opacity:0;pointer-events:none;z-index:-1;overflow:hidden;border-radius:12px;transition:opacity .5s}
  #spWrap.need{opacity:1;pointer-events:auto;z-index:100}

  #svgB{left:47px;top:25px;width:830px;height:1250px;-webkit-mask-image:linear-gradient(to right,transparent,#000 2%,#000 98%,transparent);mask-image:linear-gradient(to right,transparent,#000 2%,#000 98%,transparent)}
  #vinylSpin{transform-box:fill-box;transform-origin:center}
  #e-vinyl.hint #vinylSpin{filter:drop-shadow(0 0 6px rgba(255,240,210,.55))}
  #vHint{fill:none;stroke:rgba(255,238,200,.9);stroke-width:2.2;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
  #vHint.on{animation:vring 1.9s ease-out infinite}
  @keyframes vring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
</style>
</head>

<!-- MEKTUP / KAPAK -->
<div id="cover">
  <div class="door" id="dL"></div>
  <div class="door" id="dR"></div>
  <div id="seamShadow"></div>
  <div id="hintSeal"></div>
  <div id="seal" role="button" aria-label="Davetiyeyi aç">
    <div class="half l"><img src="assets/seal.png" alt=""></div>
    <div class="half r"><img src="assets/seal.png" alt=""></div>
  </div>
</div>

<div id="spWrap" aria-hidden="true"><div id="spEmbed"></div></div>
<audio id="song" src="song.mp3" loop preload="auto" playsinline></audio>

<script>
/* =========================================================
   AYARLAR — burayı kendinize göre değiştirin
   ========================================================= */
const CONFIG = {
  songFile: "song.mp3",                    // Kendi mp3 dosyanız varsa index.html ile aynı klasöre koyun (önce bu çalar)
  spotifyTrack: "",                        // Spotify yedeği KAPALI (reklam girdiği için). song.mp3 çalar. Açmak için parça kodunu yazın
  address: "Zeytinburnu Nikah Dairesi, Kazlıçeşme, Abay Cd. No:165, 34020 Zeytinburnu/İstanbul",
  locationUrl: "",                         // boş bırakılırsa adresten otomatik Google Haritalar bağlantısı üretilir
  stripSeconds: 1.9                        // fotoğrafların delikten inme süresi (CSS'teki .drop süresiyle aynı)
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---- Ekrana sığdır (telefon + bilgisayar): sayfa genişliği 830, yüksekliği 1250 tasarım birimi ---- */
function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw/830, vh/1250);
  $('stage').style.transform = `scale(${s})`;
  document.documentElement.style.setProperty('--s', s);
}
addEventListener('resize', fit); addEventListener('orientationchange', fit); fit();

/* ---- Lokasyon ---- */
const mapsUrl = CONFIG.locationUrl || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONFIG.address));
['loc'].forEach(id => { const a = $(id); a.setAttribute('href', mapsUrl); a.setAttribute('target','_blank'); a.setAttribute('rel','noopener'); });

/* ---- Ses ---- */
const song = $('song');
song.src = CONFIG.songFile;
let songOK = true;
song.addEventListener('error', () => { songOK = false; });
let actx = null;
function ctx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended') actx.resume(); return actx; }
/* iPhone/Android: ses izni dokunuş sırasında alınır */
function unlockAudio(){
  try{ ctx(); }catch(e){}
  try{
    song.muted = true;
    const p = song.play();
    if(p && p.then) p.then(()=>{ song.pause(); song.currentTime = 0; song.muted = false; }).catch(()=>{ song.muted = false; });
  }catch(e){}
}
function click(){
  try{
    const c = ctx(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type='square'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(60,t+.08);
    g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.1);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+.12);
  }catch(e){}
}
/* Hiçbiri yoksa son yedek: müzik kutusu melodisi (Für Elise – kamu malı) */
const midi = n => 440*Math.pow(2,(n-69)/12);
const MELODY = [
  [76,1],[75,1],[76,1],[75,1],[76,1],[71,1],[74,1],[72,1],[69,2],[0,1],
  [60,1],[64,1],[69,1],[71,2],[0,1],[64,1],[68,1],[71,1],[72,2],[0,1],
  [64,1],[76,1],[75,1],[76,1],[75,1],[76,1],[71,1],[74,1],[72,1],[69,2],[0,1],
  [60,1],[64,1],[69,1],[71,2],[0,1],[64,1],[72,1],[71,1],[69,3],[0,3]
];
let synthTimer = null, synthOn = false;
function synthStart(){
  const c = ctx(); synthOn = true; let i = 0; const step = .30;
  function tick(){
    if(!synthOn) return;
    const [m,len] = MELODY[i % MELODY.length]; i++;
    if(m){
      const t = c.currentTime, f = midi(m);
      [[1,.22],[2,.07],[3.01,.03]].forEach(([h,a])=>{
        const o=c.createOscillator(), g=c.createGain();
        o.type='sine'; o.frequency.value=f*h;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a,t+.008);
        g.gain.exponentialRampToValueAtTime(.0008,t+1.1);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t+1.2);
      });
    }
    synthTimer = setTimeout(tick, step*len*1000);
  }
  tick();
}
function synthStop(){ synthOn=false; clearTimeout(synthTimer); }

/* ---- Spotify (görünmez oynatıcı) ---- */
let spCtl = null, spStarted = false;
function loadSpotify(){
  if(!CONFIG.spotifyTrack || document.getElementById('spApi')) return;
  window.onSpotifyIframeApiReady = (API) => {
    API.createController($('spEmbed'), {uri:'spotify:track:'+CONFIG.spotifyTrack, width:'100%', height:80}, (c) => {
      spCtl = c;
      c.addListener('playback_update', e => {
        const on = !!(e.data && !e.data.isPaused);
        if(on){ spStarted = true; $('spWrap').classList.remove('need'); setSpin(true); }
        else if(spStarted){ spStarted = false; setSpin(false); }    // önizleme bitti / durdu
      });
    });
  };
  const sc = document.createElement('script'); sc.id='spApi'; sc.async = true;
  sc.src = 'https://open.spotify.com/embed/iframe-api/v1';
  document.body.appendChild(sc);
}

let playing = false;
function setSpin(on){ $('vinylSpin').classList.toggle('spin', on); notes(on); playing = on; $('vHint').classList.toggle('on', !on && vReady); }
let vReady = false;
async function playSong(){
  setSpin(true);
  if(songOK){ try{ await song.play(); return; }catch(e){} }
  if(spCtl){
    try{ spCtl.play(); }catch(e){}
    // Tarayıcı sesi engellediyse, 3 sn sonra oynatıcı tek seferlik görünür (dokununca çalar, çalınca tekrar gizlenir)
    setTimeout(() => { if(!spStarted) $('spWrap').classList.add('need'); }, 3000);
    return;
  }
  synthStart();
}
function pauseSong(){
  setSpin(false);
  song.pause(); synthStop();
  $('spWrap').classList.remove('need');
  if(spCtl){ try{ spCtl.pause(); }catch(e){} }
}
$('vinylHit').addEventListener('click', () => { unlockAudio(); playing ? pauseSong() : playSong(); });

let noteTimer = null;
function notes(on){
  clearInterval(noteTimer);
  if(!on) return;
  const sym = ['♪','♫','♩','♬'];
  const spawn = () => {
    const n = document.createElement('div');
    n.className = 'note'; n.textContent = sym[Math.floor(Math.random()*sym.length)];
    n.style.left = (655 + Math.random()*60) + 'px'; n.style.top = '925px';
    n.style.setProperty('--dx', (Math.random()*120-30)+'px');
    n.style.setProperty('--rt', (Math.random()*50-25)+'deg');
    $('sceneB').appendChild(n); requestAnimationFrame(()=>n.classList.add('go'));
    setTimeout(()=>n.remove(), 3800);
  };
  spawn(); noteTimer = setInterval(spawn, 900);
}

/* Soldan sağa "yazılıyormuş" gibi açılma */
function wipe(rectId, groupId, full, ms){
  const g = $(groupId), r = $(rectId); g.style.opacity = 1;
  const t0 = performance.now();
  (function step(t){
    const k = Math.min(1,(t-t0)/ms), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    r.setAttribute('width', full*e);
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

/* =========================================================
   AKIŞ
   1) Mühre dokun → mektup açılır
   2) Mektup açılır açılmaz fotoğraflar delikten iner
   3) Düğmeye basınca 4. sayfa animasyonla gelir
   4) Plakta şarkı çalar
   ========================================================= */
let started = false;
$('seal').addEventListener('click', async () => {
  if(started) return; started = true;
  unlockAudio(); song.load(); loadSpotify();
  $('hintSeal').classList.add('hide');
  $('seal').classList.add('broken');                    // mühür ikiye ayrılır
  await sleep(450);
  $('cover').classList.add('open');                     // mektup açılır
  ['a-plate','a-top','a-names','a-bottom'].forEach((id,i)=> setTimeout(()=>$(id).classList.add('show'), 250 + i*250));
  setTimeout(()=> $('strip').classList.add('drop'), 900);        // kapak açılırken fotoğraflar inmeye başlar
  setTimeout(()=> $('cover').classList.add('gone'), 2500);
  setTimeout(()=>{ $('btn').classList.add('ready'); $('hintBtn').classList.add('show'); },
             900 + CONFIG.stripSeconds*1000 + 250);
});

let pressed = false;
$('btn').addEventListener('click', async () => {
  if(pressed || !$('btn').classList.contains('ready')) return; pressed = true;
  unlockAudio(); click();
  $('btn').classList.add('pressed'); $('btn').classList.remove('ready');
  $('hintBtn').classList.remove('show'); $('hintBtn').style.opacity = 0;
  await sleep(450);

  $('strip').classList.remove('drop'); $('strip').classList.add('leave');
  await sleep(500);
  $('sceneA').classList.add('out');
  $('sceneB').classList.add('in');
  await sleep(300);
  $('e-frame').classList.add('show');
  await sleep(1100);

  // 4. sayfa öğeleri PDF'teki katman düzeniyle sırayla animasyonlu çıkar
  const T = .85;
  const seq = [];
  seq.forEach(([id,t,fn]) => setTimeout(()=>{ if(fn) fn(); else $(id).classList.add('show'); }, t*T));
  await sleep(1800);
  vReady = true; $('vHint').classList.add('on');
  playSong();                                           // plakta şarkı çalar
});
</script>
</body>
</html>
